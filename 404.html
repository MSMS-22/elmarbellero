<head>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
        }

        .page-wrapper {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            position: relative;
            overflow: hidden;
        }

        .aurora-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            background: linear-gradient(135deg, #ff6666, #e3e57b, #ff2929, #e3e57b, #ff6666);
            background-size: 400% 400%;
            animation: aurora-shift 12s ease infinite;
        }

        .aurora-background::after {
            content: '';
            position: absolute;
            top: -10%;
            left: -10%;
            width: 120%;
            height: 120%;
            background:
                radial-gradient(ellipse at 30% 40%, rgba(227,229,123,0.5), transparent 60%),
                radial-gradient(ellipse at 70% 60%, rgba(255,102,102,0.4), transparent 55%),
                radial-gradient(ellipse at 50% 80%, rgba(255,41,41,0.3), transparent 50%);
            animation: aurora-pulse 8s ease-in-out infinite alternate;
            filter: blur(40px);
        }

        @keyframes aurora-shift {
            0% { background-position: 0% 50%; }
            25% { background-position: 50% 0%; }
            50% { background-position: 100% 50%; }
            75% { background-position: 50% 100%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes aurora-pulse {
            0% { opacity: 0.6; transform: scale(1) rotate(0deg); }
            100% { opacity: 1; transform: scale(1.15) rotate(3deg); }
        }

        .page-wrapper::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
            z-index: 1;
        }

        .content {
            position: relative;
            z-index: 2;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        .logo {
            width: 120px;
            height: auto;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.5));
            margin-bottom: 1rem;
        }

        .error-code {
            font-family: 'Montserrat', sans-serif;
            font-size: 9rem;
            font-weight: 300;
            color: #fff;
            line-height: 1;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            letter-spacing: 0.05em;
        }

        .error-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.4rem;
            font-weight: 300;
            color: #fff;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.35);
            max-width: 500px;
            line-height: 1.5;
        }

        .error-subtitle {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.1rem;
            font-weight: 100;
            color: rgba(255, 255, 255, 0.85);
            text-shadow: 0 1px 8px rgba(0, 0, 0, 0.3);
            max-width: 440px;
            line-height: 1.5;
            margin-bottom: 0.5rem;
        }

        .whatsapp-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 32px;
            font-family: 'Montserrat', sans-serif;
            font-size: 1.05rem;
            font-weight: 300;
            color: #fff;
            text-decoration: none;
            border: 1.5px solid rgba(255, 255, 255, 0.7);
            border-radius: 50px;
            backdrop-filter: blur(6px);
            background: rgba(255, 255, 255, 0.1);
            transition: background 0.3s ease, border-color 0.3s ease, transform 0.2s ease;
            letter-spacing: 0.03em;
            margin-top: 1rem;
        }

        .whatsapp-btn:hover {
            background: rgba(255, 255, 255, 0.22);
            border-color: #fff;
            transform: translateY(-2px);
        }

        .whatsapp-btn:active {
            transform: translateY(0);
        }

        .whatsapp-btn:focus-visible {
            outline: 2px solid #dd9128;
            outline-offset: 3px;
        }

        .whatsapp-btn svg {
            width: 22px;
            height: 22px;
            fill: #fff;
            flex-shrink: 0;
        }

        @media (max-width: 768px) {
            .error-code {
                font-size: 7rem;
            }

            .error-title {
                font-size: 1.2rem;
            }

            .error-subtitle {
                font-size: 1rem;
            }

            .whatsapp-btn {
                padding: 12px 28px;
                font-size: 1rem;
            }
        }

        @media (max-width: 600px) {
            .logo {
                width: 90px;
            }

            .error-code {
                font-size: 5.5rem;
            }

            .error-title {
                font-size: 1.05rem;
                max-width: 320px;
            }

            .error-subtitle {
                font-size: 0.92rem;
                max-width: 300px;
            }

            .whatsapp-btn {
                padding: 11px 24px;
                font-size: 0.92rem;
            }
        }
    </style>
</head>
